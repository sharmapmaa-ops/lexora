<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" width="620" height="500" role="img" aria-label="Documents being translated, read and converted on a laptop">
  <defs>
    <linearGradient id="hScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#0b3fd4"/>
    </linearGradient>
    <linearGradient id="hBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf1fe"/><stop offset="1" stop-color="#c3d7f7"/>
    </linearGradient>
    <linearGradient id="hCloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b9bf8"/><stop offset="1" stop-color="#1257f5"/>
    </linearGradient>
    <linearGradient id="hPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#dbe8fe" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="hGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bcd6fb" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e8f1fe" stop-opacity="0"/>
    </linearGradient>
    <filter id="hSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1b4fd0" flood-opacity=".16"/>
    </filter>
    <filter id="hSoftSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1b4fd0" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="310" cy="270" rx="300" ry="215" fill="url(#hGlow)"/>

  <!-- faint dot grid, gives the flat art some depth without competing -->
  <g fill="#9dc0f5" opacity=".33">
    <circle cx="42" cy="96" r="2.5"/><circle cx="86" cy="150" r="2"/><circle cx="38" cy="206" r="2"/>
    <circle cx="96" cy="262" r="2.5"/><circle cx="44" cy="322" r="2"/><circle cx="574" cy="128" r="2.5"/>
    <circle cx="536" cy="190" r="2"/><circle cx="580" cy="250" r="2"/><circle cx="546" cy="318" r="2.5"/>
    <circle cx="588" cy="378" r="2"/>
  </g>

  <!-- floating capability panels behind the laptop -->
  <g filter="url(#hSoft)">
    <rect x="300" y="34" width="196" height="128" rx="14" fill="url(#hPanel)" stroke="#c5daf9"/>
    <text x="320" y="66" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1257f5" letter-spacing=".6">TRANSLATION</text>
    <circle cx="342" cy="110" r="26" fill="none" stroke="#7fb0f4" stroke-width="2.5"/>
    <path d="M316 110h52M342 84c11 14 11 38 0 52M342 84c-11 14-11 38 0 52" fill="none" stroke="#7fb0f4" stroke-width="2"/>
    <text x="392" y="106" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#1257f5">A</text>
    <text x="408" y="118" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#5b9bf8">文</text>
    <path d="M386 122h40" stroke="#9dc0f5" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g filter="url(#hSoft)">
    <rect x="386" y="150" width="206" height="150" rx="14" fill="url(#hPanel)" stroke="#c5daf9"/>
    <text x="406" y="182" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1257f5" letter-spacing=".5">DATA EXTRACTION</text>
    <g fill="#bcd6fb">
      <rect x="406" y="198" width="112" height="9" rx="4.5"/>
      <rect x="406" y="220" width="86" height="9" rx="4.5"/>
      <rect x="406" y="242" width="122" height="9" rx="4.5"/>
      <rect x="406" y="264" width="70" height="9" rx="4.5"/>
    </g>
    <g fill="none" stroke="#1257f5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="548" cy="202" r="11"/><path d="m543.5 202 3.4 3.4 5.6-6.4"/>
      <circle cx="548" cy="246" r="11"/><path d="m543.5 246 3.4 3.4 5.6-6.4"/>
    </g>
    <g fill="none" stroke="#34c48a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="548" cy="224" r="11"/><path d="m543.5 224 3.4 3.4 5.6-6.4"/>
    </g>
  </g>

  <!-- file-type tiles on the left -->
  <g filter="url(#hSoftSm)">
    <rect x="128" y="118" width="66" height="82" rx="12" fill="#fff"/>
    <path d="M128 130a12 12 0 0 1 12-12h30l24 24v46a12 12 0 0 1-12 12h-42a12 12 0 0 1-12-12z" fill="#fdeced"/>
    <rect x="134" y="146" width="54" height="30" rx="7" fill="#e8433f"/>
    <text x="161" y="167" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff">PDF</text>
  </g>
  <g filter="url(#hSoftSm)">
    <rect x="46" y="196" width="66" height="82" rx="12" fill="#eaf7f0"/>
    <rect x="52" y="224" width="54" height="30" rx="7" fill="#1e9d63"/>
    <text x="79" y="245" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#fff">XLSX</text>
  </g>
  <g filter="url(#hSoftSm)">
    <rect x="124" y="216" width="66" height="82" rx="12" fill="#e9f0fe"/>
    <rect x="130" y="244" width="54" height="30" rx="7" fill="#1257f5"/>
    <text x="157" y="265" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#fff">DOCX</text>
  </g>

  <!-- laptop -->
  <g filter="url(#hSoft)">
    <rect x="176" y="146" width="272" height="192" rx="14" fill="#22324f"/>
    <rect x="186" y="156" width="252" height="172" rx="8" fill="url(#hScreen)"/>

    <!-- document on screen -->
    <rect x="204" y="176" width="112" height="136" rx="8" fill="#fff" opacity=".97"/>
    <text x="218" y="212" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#1257f5">T</text>
    <g fill="#c9dcfa">
      <rect x="216" y="224" width="86" height="7" rx="3.5"/>
      <rect x="216" y="240" width="66" height="7" rx="3.5"/>
    </g>
    <rect x="216" y="256" width="86" height="44" rx="6" fill="#e6effd"/>
    <circle cx="234" cy="272" r="6" fill="#9dc0f5"/>
    <path d="m222 294 16-15 12 11 10-8 14 12z" fill="#9dc0f5"/>

    <!-- checklist on screen -->
    <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#eaf2ff">
      <g fill="none" stroke="#eaf2ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="342" cy="196" r="9"/><path d="m338.4 196 2.7 2.7 4.5-5.2"/>
        <circle cx="342" cy="226" r="9"/><path d="m338.4 226 2.7 2.7 4.5-5.2"/>
        <circle cx="342" cy="256" r="9"/><path d="m338.4 256 2.7 2.7 4.5-5.2"/>
        <circle cx="342" cy="286" r="9"/><path d="m338.4 286 2.7 2.7 4.5-5.2"/>
      </g>
      <text x="360" y="201">Translate</text>
      <text x="360" y="231">Extract</text>
      <text x="360" y="261">Convert</text>
      <text x="360" y="291">Secure</text>
    </g>
  </g>

  <!-- laptop deck -->
  <path d="M140 338h344l30 34a8 8 0 0 1-6 13H116a8 8 0 0 1-6-13z" fill="url(#hBase)" stroke="#b9d0f3"/>
  <rect x="266" y="376" width="92" height="7" rx="3.5" fill="#9dc0f5"/>

  <!-- OCR badge -->
  <g filter="url(#hSoftSm)">
    <rect x="452" y="312" width="76" height="78" rx="14" fill="#1257f5"/>
    <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
      <path d="M470 336v-6a4 4 0 0 1 4-4h6M510 336v-6a4 4 0 0 0-4-4h-6M470 352v6a4 4 0 0 0 4 4h6M510 352v6a4 4 0 0 0-4 4h-6"/>
      <path d="M474 344h32"/>
    </g>
    <text x="490" y="382" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff">OCR</text>
  </g>

  <!-- upload cloud -->
  <g filter="url(#hSoft)">
    <path d="M252 452a34 34 0 0 1 3-67 45 45 0 0 1 84-9 30 30 0 0 1-6 76z" fill="url(#hCloud)"/>
    <path d="M296 436v-40M280 412l16-16 16 16" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
