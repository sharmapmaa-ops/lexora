    <!-- Phase 4d: this file is loaded into index.html's #contentFrame -
         it is one real, standalone section page (not innerHTML injected
         into a shared shell). window.__lexoraSectionId tells app.js's
         existing loadContent()/CONTENT_DATA dispatch which section this
         is; app.js itself is unchanged from the shell's copy, so every
         mechanism already defined there (billing, activity logs,
         background-job polling, etc.) works exactly the same here. -->
    <div id="contentArea" class="content-area">
        <div id="contentBody"></div>
    </div>

    <div class="msg-overlay" id="messageOverlay">
        <div class="msg-card">
            <div class="msg-card-inner">
                <button class="msg-close-btn" onclick="handleButtonClick('Close')" aria-label="Close">✕</button>
                <div class="msg-title-bar">
                    <span class="msg-title" id="msgTitle">Message</span>
                </div>
                <div class="msg-content">
                    <div class="msg-text" id="msgText"></div>
                    <div class="msg-buttons" id="msgButtons"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      const AMIRI_FONT_URL = 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf';

      const AMIRI_BOLDITALIC_FONT_URL = 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-BoldItalic.ttf';
      // Tells app.js (loaded below, identical to the shell's copy) which
      // section this standalone page represents.
      window.__lexoraSectionId = 'profile';
    </script>
