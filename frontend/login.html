<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>Lexora AI Solutions</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#00008B" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/design-system.css">
<style>
    html, body { height: 100%; margin: 0; }
    .shell-frame {
        display: block;
        width: 100%;
        border: 0;
        height: calc(100vh - 62px);
        background: var(--ds-page, #f4f6fb);
    }
    .shell-menu-item.disabled-hint { cursor: pointer; }
    .login-required-toast {
        position: fixed;
        top: 78px;
        left: 50%;
        transform: translateX(-50%);
        background: #1e293b;
        color: #fff;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 14px;
        box-shadow: 0 6px 20px rgba(0,0,0,.25);
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
        transition: opacity .25s ease;
    }
    .login-required-toast.show { opacity: 1; }
</style>
</head>
<body>

    <!-- ===== TOP MENU BAR (static shell - not app.js driven) ===== -->
    <div class="top-menu-bar" id="topMenuBar">
        <div class="menu-left">
            <div class="company-logo" id="companyLogo">🏢</div>
            <div class="company-info">
                <span class="company-name" id="companyName">
                    Lexora
                    <span class="separator" id="separator">|</span>
                </span>
                <span class="current-menu-name" id="currentMenuLabel">
                    <span id="currentMenuDisplay">Home</span>
                </span>
            </div>
        </div>

        <div class="menu-wrapper" id="menuWrapper">
            <ul class="menu" id="mainMenu">
                <li class="menu-item"><a href="javascript:void(0)" data-page="home" class="active" onclick="lexoraShellNav('home', this)">🏠 Home</a></li>
                <li class="menu-item"><a href="javascript:void(0)" data-page="services" onclick="lexoraShellNav('services', this)">🛠️ Services</a></li>
                <li class="menu-item"><a href="javascript:void(0)" data-page="plans" onclick="lexoraShellNav('plans', this)">📋 Plan &amp; Offers</a></li>
                <li class="menu-item"><a href="javascript:void(0)" data-page="contact" onclick="lexoraShellNav('contact', this)">📞 Contact Us</a></li>
                <li class="menu-item"><a href="javascript:void(0)" data-page="login" onclick="lexoraShellNav('login', this)">🔑 Login</a></li>
            </ul>
        </div>

        <button class="menu-toggle" id="menuToggle" onclick="document.getElementById('menuWrapper').classList.toggle('open')">☰</button>
    </div>

    <!-- ===== IFRAME > page content ===== -->
    <iframe id="contentFrame" class="shell-frame" title="Lexora content" src="login-content.html"></iframe>

    <div class="login-required-toast" id="loginToast">Please login to access this section.</div>

    <script>
        // If already logged in, jump straight to the dashboard shell.
        (function () {
            var loggedIn = !!localStorage.getItem('lexora_session_user_id');
            if (loggedIn) {
                window.location.replace('dashboard.html');
            }
        })();

        var PAGE_SRC = {
            home: 'login-content.html',
            services: 'services-content.html',
            plans: 'plans-offers-content.html',
            contact: 'contact-us-content.html',
            login: 'login-content.html'
        };
        var LOGIN_REQUIRED = { services: true, plans: true };
        var PAGE_LABEL = {
            home: 'Home', services: 'Services', plans: 'Plan & Offers',
            contact: 'Contact Us', login: 'Login'
        };

        function lexoraShellNav(page, el) {
            document.querySelectorAll('#mainMenu a').forEach(function (a) { a.classList.remove('active'); });
            if (el) el.classList.add('active');
            document.getElementById('currentMenuDisplay').textContent = PAGE_LABEL[page] || page;

            var loggedIn = !!localStorage.getItem('lexora_session_user_id');
            if (LOGIN_REQUIRED[page] && !loggedIn) {
                var toast = document.getElementById('loginToast');
                toast.classList.add('show');
                setTimeout(function () { toast.classList.remove('show'); }, 2200);
            }
            document.getElementById('contentFrame').src = PAGE_SRC[page];
        }

        // If a logged-in session appears while sitting on this page
        // (e.g. user logs in inside the iframe), move to the dashboard shell.
        window.addEventListener('message', function (e) {
            if (e.data && e.data.lexoraFrame && e.data.status === 'logged-in') {
                window.location.replace('dashboard.html');
            }
        });
    </script>
</body>
</html>
