<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img" aria-label="Secure document storage and search">
  <defs>
    <linearGradient id="sFolder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9bf8"/><stop offset="1" stop-color="#1257f5"/>
    </linearGradient>
    <linearGradient id="sPodium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcebfe"/><stop offset="1" stop-color="#b9d3f7"/>
    </linearGradient>
    <linearGradient id="sPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb0f4"/><stop offset="1" stop-color="#2f7bf6"/>
    </linearGradient>
    <linearGradient id="sGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4dafb" stop-opacity=".5"/>
      <stop offset="1" stop-color="#eaf2fe" stop-opacity="0"/>
    </linearGradient>
    <filter id="sSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#1b4fd0" flood-opacity=".18"/>
    </filter>
  </defs>

  <ellipse cx="240" cy="180" rx="230" ry="160" fill="url(#sGlow)"/>

  <!-- dashed frame corners, echoes the "scan area" idea -->
  <g fill="none" stroke="#9dc0f5" stroke-width="2" stroke-dasharray="5 7" opacity=".65">
    <path d="M30 96V44h52M450 96V44h-52M30 250v50h52M450 250v50h-52"/>
  </g>

  <!-- podium -->
  <ellipse cx="240" cy="272" rx="132" ry="32" fill="url(#sPodium)"/>
  <ellipse cx="240" cy="262" rx="132" ry="32" fill="#eaf2fe"/>
  <ellipse cx="240" cy="262" rx="104" ry="24" fill="#dbe8fe"/>

  <!-- back panel -->
  <g filter="url(#sSoft)">
    <rect x="236" y="46" width="92" height="150" rx="12" fill="url(#sPanel)"/>
    <g fill="#fff" opacity=".55">
      <rect x="250" y="66" width="64" height="6" rx="3"/>
      <rect x="250" y="82" width="44" height="6" rx="3"/>
    </g>
  </g>

  <!-- stacked documents -->
  <g filter="url(#sSoft)">
    <rect x="150" y="58" width="86" height="122" rx="10" fill="#eef4fe"/>
    <rect x="140" y="50" width="86" height="122" rx="10" fill="#f7faff"/>
    <rect x="130" y="42" width="90" height="126" rx="10" fill="#fff"/>
    <circle cx="152" cy="70" r="12" fill="none" stroke="#e8433f" stroke-width="5"/>
    <path d="M152 58a12 12 0 0 1 12 12h-12z" fill="#f2b13c"/>
    <g fill="#c9dcfa">
      <rect x="174" y="62" width="34" height="6" rx="3"/>
      <rect x="174" y="76" width="26" height="6" rx="3"/>
      <rect x="142" y="98" width="66" height="6" rx="3"/>
      <rect x="142" y="112" width="52" height="6" rx="3"/>
      <rect x="142" y="126" width="60" height="6" rx="3"/>
      <rect x="142" y="140" width="40" height="6" rx="3"/>
    </g>
  </g>

  <!-- folder + shield -->
  <g filter="url(#sSoft)">
    <path d="M74 108h56l14 18h72a12 12 0 0 1 12 12v82a12 12 0 0 1-12 12H74a12 12 0 0 1-12-12V120a12 12 0 0 1 12-12z" fill="url(#sFolder)"/>
    <path d="M128 158a44 44 0 0 0 26 12v26c0 17-11 30-26 36-15-6-26-19-26-36v-26a44 44 0 0 0 26-12z" fill="#eaf2fe"/>
    <rect x="118" y="192" width="20" height="16" rx="3" fill="#1257f5"/>
    <path d="M122 192v-5a6 6 0 0 1 12 0v5" fill="none" stroke="#1257f5" stroke-width="3"/>
  </g>

  <!-- phone / report card -->
  <g filter="url(#sSoft)">
    <rect x="228" y="120" width="74" height="130" rx="12" fill="#fff"/>
    <circle cx="252" cy="146" r="13" fill="none" stroke="#2f7bf6" stroke-width="5"/>
    <path d="M252 133a13 13 0 0 1 13 13h-13z" fill="#c9dcfa"/>
    <g fill="#c9dcfa">
      <rect x="274" y="140" width="18" height="5" rx="2.5"/>
      <rect x="274" y="152" width="14" height="5" rx="2.5"/>
      <rect x="240" y="172" width="50" height="5" rx="2.5"/>
      <rect x="240" y="184" width="38" height="5" rx="2.5"/>
    </g>
    <g fill="#2f7bf6">
      <rect x="240" y="222" width="9" height="14" rx="2"/>
      <rect x="254" y="214" width="9" height="22" rx="2"/>
      <rect x="268" y="204" width="9" height="32" rx="2"/>
      <rect x="282" y="196" width="9" height="40" rx="2"/>
    </g>
  </g>

  <!-- format tiles -->
  <g filter="url(#sSoft)">
    <rect x="318" y="96" width="54" height="54" rx="12" fill="#1257f5"/>
    <text x="345" y="133" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="700" fill="#fff">W</text>
  </g>
  <g filter="url(#sSoft)">
    <rect x="384" y="118" width="54" height="54" rx="12" fill="#1e9d63"/>
    <text x="411" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="700" fill="#fff">X</text>
  </g>
  <g filter="url(#sSoft)">
    <rect x="352" y="176" width="62" height="54" rx="12" fill="#e8433f"/>
    <text x="383" y="211" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#fff">PDF</text>
  </g>

  <!-- magnifier -->
  <g filter="url(#sSoft)">
    <circle cx="196" cy="222" r="34" fill="#eaf2fe" stroke="#22324f" stroke-width="8"/>
    <circle cx="196" cy="222" r="26" fill="#fff" opacity=".55"/>
    <path d="m222 248 30 30" stroke="#22324f" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
