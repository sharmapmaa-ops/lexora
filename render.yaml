# Render Blueprint (https://render.com/docs/blueprint-spec).
# In the Render dashboard: New -> Blueprint -> point it at this repo, and
# it picks this file up automatically. Uses the Dockerfile (not Render's
# native Python runtime) specifically so the tesseract-ocr system package
# needed for scanned-PDF OCR actually gets installed - Render's native
# Python build has no apt-get step.
#
# NOTE: Render's free tier has an ephemeral filesystem - anything written
# to Users/ (profile photos, processed leases) is lost on redeploy/restart.
# For that to persist, add a paid-plan persistent disk mounted at
# /app/Users (see Render's "Disks" docs) - not included here since it
# needs a paid plan.
services:
  - type: web
    name: lexora-ai-solutions
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      # sync: false = Render prompts for these in its dashboard instead of
      # reading them from this file - .env itself is gitignored and never
      # part of the repo Render builds from, so there's nothing to leak
      # here. Set the real values under your Render service's
      # Environment tab after the first deploy.
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SENDER_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "false"
      - key: SMTP_EXPIRY_MINUTES
        value: "4"
