# Render Blueprint (https://render.com/docs/blueprint-spec).
# In the Render dashboard: New -> Blueprint -> point it at this repo, and
# it picks this file up automatically. Uses the Dockerfile (not Render's
# native Python runtime) specifically so the tesseract-ocr system package
# needed for scanned-PDF OCR actually gets installed - Render's native
# Python build has no apt-get step.
#
# PERSISTENCE: the container filesystem is rebuilt from this repo on every
# deploy, so anything written at runtime (registered users, wallet
# transactions, admin edits to json/plans.json, processed files) would be
# lost on each redeploy. The disk below fixes that: LEXORA_DATA_DIR points
# server.py at the mounted disk, and on first boot it seeds that disk with
# the repo's default json/ and Users/ contents. After that, deploys replace
# CODE ONLY - live data on the disk is never overwritten.
# NOTE: persistent disks require a paid instance type.
services:
  - type: web
    name: lexora-ai-solutions
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    disk:
      name: lexora-data
      mountPath: /var/lexora-data
      sizeGB: 1
    envVars:
      # Points server.py at the persistent disk above. Remove this and the
      # app falls back to repo-local json/ and Users/ (fine locally, but
      # data is lost on every deploy in a container environment).
      - key: LEXORA_DATA_DIR
        value: /var/lexora-data
      # sync: false = Render prompts for these in its dashboard instead of
      # reading them from this file - .env itself is gitignored and never
      # part of the repo Render builds from, so there's nothing to leak
      # here. Set the real values under your Render service's
      # Environment tab after the first deploy.
      # Razorpay: real "Add Balance" payment gateway. sync: false = set the
      # real values under the Render service's Environment tab (test-mode
      # keys first, switch to live-mode only when ready to accept real
      # payments).
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_CURRENCY
        value: INR
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SENDER_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "false"
      - key: SMTP_EXPIRY_MINUTES
        value: "4"
